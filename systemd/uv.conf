# Drop-in for a uv checkout: run the daemon from the checkout's .venv instead of /usr/bin.
# Install to ~/.config/systemd/user/linux-recall.service.d/uv.conf; edit the path if you cloned elsewhere.
[Service]
ExecStart=
ExecStart=%h/WorkSpace/windows_recall_linux/.venv/bin/linux-recall-daemon --interval 60 --threshold 0.95
